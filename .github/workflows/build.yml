name: Build APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      # Requires eas.json to have a profile with "buildType": "apk", e.g.:
      # {
      #   "build": {
      #     "preview": {
      #       "android": { "buildType": "apk" }
      #     }
      #   }
      # }
      - name: Build APK with EAS (local build)
        run: eas build --platform android --profile preview --local --non-interactive --output ./build.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyPhoneControl-APK
          path: ./build.apk
