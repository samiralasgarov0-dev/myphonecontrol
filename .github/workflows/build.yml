name: Build APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build APK with EAS (cloud build)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build-result.json
          cat build-result.json

      - name: Extract download URL
        id: extract
        run: |
          URL=$(node -e "const d=require('./build-result.json'); console.log(d[0].artifacts.buildUrl)")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: curl -L "${{ steps.extract.outputs.url }}" -o build.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyPhoneControl-APK
          path: ./build.apk
